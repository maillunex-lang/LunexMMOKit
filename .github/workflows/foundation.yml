name: Foundation
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m json.tool shared/zone.schema.json >/dev/null
      - run: bash -n tests/smoke.sh
      - run: test -f client/project.godot && test -f client/scenes/main.tscn
      - run: python3 tools/roadmap.py validate
      - run: test -f docs/BETA_001.md && test -f docs/AUDIT_001.md

  go-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go test ./...
      - run: go build -o /tmp/lunexd ./cmd/lunexd

  # Godot headless smokes when Godot is available on the runner image (optional).
  # Self-hosted VPS runs these via tools/run_audit_smokes.sh
